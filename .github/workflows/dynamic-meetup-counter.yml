name: Rebuild meetup directory data

on:
  push:
    paths:
      - 'UK-Bitcoin-Meetups-Directory.md'
      - 'generate-meetups.py'
      - '.github/workflows/dynamic-meetup-counter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-meetup-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate website meetup data
        run: python generate-meetups.py

      - name: Commit generated meetup data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetups-source.html
          if ! git diff --cached --quiet; then
            git commit -m "Update meetup data from Markdown directory"
            git push
          fi
