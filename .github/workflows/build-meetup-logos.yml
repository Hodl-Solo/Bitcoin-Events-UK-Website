name: Build meetup logo thumbnails

on:
  push:
    paths:
      - 'assets/meetup-artwork/**'
      - 'build-meetup-logos.py'
      - '.github/workflows/build-meetup-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build logo thumbnails
        run: python build-meetup-logos.py

      - name: Commit generated logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meetup-logos
          if ! git diff --cached --quiet; then
            git commit -m "Build meetup logo thumbnails"
            git push
          fi
