name: Fetch BEUK Nostr Posts

on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip3 install websocket-client bech32 --break-system-packages

      - name: Run script
        run: python3 fetch_nostr_posts.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git config --local push.default simple
          git add _data/nostr-posts.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Nostr posts" || echo "Commit failed"
            git push || echo "Push failed"
          fi
