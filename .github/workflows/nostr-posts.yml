name: Fetch BEUK Nostr Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install websocket-client bech32 requests
          python3 -c "import bech32; print('bech32 OK')"
          python3 -c "import websocket; print('websocket OK')"

      - name: Debug - print versions
        run: |
          python3 --version
          pip3 list | grep -E "bech32|websocket"

      - name: Fetch Nostr posts
        run: |
          python3 << 'PY'
          import json
          import time
          import websocket
          import bech32

          print(f"bech32 module: {bech32}")
          print(f"websocket module: {websocket}")

          NPUB = "npub1g8ag22auywa5c5de6w9ujenpyhrrp9qq8sjzram02xldttmmwurqfd0hqk"
          RELAYS = ["wss://relay.ditto.pub", "wss://relay.primal.net", "wss://nos.lol"]
          COUNT = 3

          def npub_to_hex(npub):
              try:
                  data = npub[5:]
                  CHARSET = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
                  values = [CHARSET.find(c.lower()) for c in data]
                  words = bech32.convertbits(values, 5, 8, pad=True)
                  return bytes(words).hex()
              except Exception as e:
                  print(f"npub_to_hex error: {e}")
                  return None

          pubkey_hex = npub_to_hex(NPUB)
          print(f"Pubkey: {pubkey_hex}")
          if not pubkey_hex:
              print("ERROR: Failed to convert npub")
              exit(1)

          def fetch_relay(relay_url, pubkey, limit):
              try:
                  ws = websocket.create_connection(relay_url, timeout=10)
                  req = json.dumps(["REQ", "sub1", {"authors": [pubkey], "kinds": [1], "limit": limit}])
                  ws.send(req)
                  posts = []
                  start = time.time()
                  while time.time() - start < 8:
                      try:
                          msg = ws.recv()
                          if msg:
                              data = json.loads(msg)
                              if data[0] == "EVENT" and data[1] == "sub1":
                                  posts.append({'id': data[2].get('id',''), 'content': data[2].get('content',''), 'created_at': data[2].get('created_at', 0)})
                                  print(f"Got post from {relay_url}")
                                  if len(posts) >= limit:
                                      break
                              elif data[0] == "EOSE":
                                  print(f"EOSE from {relay_url}")
                                  break
                      except Exception as e:
                          print(f"recv error: {e}")
                          pass
                  ws.close()
                  return posts
              except Exception as e:
                  print(f"Relay error {relay_url}: {e}")
                  return []

          all_posts = []
          seen = set()
          for relay in RELAYS:
              if len(all_posts) >= COUNT:
                  break
              print(f"Trying {relay}...")
              posts = fetch_relay(relay, pubkey_hex, COUNT)
              for p in posts:
                  if p['id'] not in seen:
                      seen.add(p['id'])
                      all_posts.append(p)
              print(f"Got {len(posts)} from {relay}")

          for p in all_posts:
              age = int(time.time()) - p.get('created_at', 0)
              if age < 3600:
                  p['created_human'] = f"{age//60}m ago"
              elif age < 86400:
                  p['created_human'] = f"{age//3600}h ago"
              else:
                  p['created_human'] = f"{age//86400}d ago"

          all_posts.sort(key=lambda x: x.get('created_at', 0), reverse=True)
          all_posts = all_posts[:COUNT]

          if not all_posts:
              all_posts = [{'id': 'demo', 'content': 'No posts yet. Check back soon!', 'created_at': int(time.time()), 'created_human': 'Just now'}]

          with open('_data/nostr-posts.json', 'w') as f:
              json.dump({'last_updated': int(time.time()), 'posts': all_posts}, f, indent=2)
          print(f"Saved {len(all_posts)} posts")
          PY

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add _data/nostr-posts.json
          git diff --cached --quiet || git commit -m "Update Nostr posts" && git push
